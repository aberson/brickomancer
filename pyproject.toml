[project]
name = "brickomancer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "rembg[cpu]>=2.0.0",
  "trimesh>=4.0.0",
  "networkx>=3.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "scikit-learn>=1.4.0",
  "scikit-image>=0.22.0",
  "basic-colormath>=0.3.0",
  "python-dotenv>=1.0.0",
  "aiofiles>=23.0.0",
]
# NOTE (rebuild): rembg + trimesh are retained for the rebuilt image path. The chosen
# 3D model (Hunyuan3D-2mini, see docs/investigations/rebuild/04-model-spike-result.md)
# and its CUDA torch deps are added in Step 5 when the ImageShaper lands.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# Archived v1 harness reference code (docs/rebuild_reference/) is frozen for Step 9
# reference and is not subject to the project's lint rules.
extend-exclude = ["docs/rebuild_reference"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]
